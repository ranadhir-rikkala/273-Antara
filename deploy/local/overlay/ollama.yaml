apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-models
  namespace: antara
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: antara
spec:
  selector: {app: ollama}
  ports: [{port: 11434}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: antara
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: ollama}}
  template:
    metadata: {labels: {app: ollama}}
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.5.4@sha256:18bfb1d605604fd53dcad20d0556df4c781e560ebebcd923454d627c994a0e37
          env:
            - {name: OLLAMA_KEEP_ALIVE, value: "24h"}
            - {name: OLLAMA_NUM_PARALLEL, value: "2"}
          ports: [{containerPort: 11434}]
          readinessProbe:
            httpGet: {path: /, port: 11434}
            periodSeconds: 5
          volumeMounts:
            - {name: models, mountPath: /root/.ollama}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: ollama-models}
