apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../k3s
  - ollama.yaml
patches:
  - target: {kind: DaemonSet, name: nvidia-device-plugin}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: DaemonSet
      metadata: {name: nvidia-device-plugin, namespace: kube-system}
  - target: {kind: ConfigMap, name: nvidia-time-slicing}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata: {name: nvidia-time-slicing, namespace: kube-system}
  - target: {kind: RuntimeClass, name: nvidia}
    patch: |-
      $patch: delete
      apiVersion: node.k8s.io/v1
      kind: RuntimeClass
      metadata: {name: nvidia}
  - target: {kind: Deployment, name: "vllm|tei-gpu|tei-cpu"}
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: ignored}
  - target: {kind: Service, name: "vllm|tei-gpu|tei-cpu"}
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: {name: ignored}
  - target: {kind: ConfigMap, name: antara-config}
    patch: |-
      - {op: replace, path: /data/LLM_MODEL, value: "qwen2.5:1.5b"}
      - {op: replace, path: /data/EMBEDDING_MODEL, value: "nomic-embed-text"}
      - {op: add, path: /data/CHAOS_ENABLED, value: "true"}
      - {op: add, path: /data/RECONCILE_EVERY_SECONDS, value: "30"}
      - {op: add, path: /data/RECONCILE_STALE_MINUTES, value: "1"}
      - {op: add, path: /data/MAX_DOCUMENTS_IN_FLIGHT, value: "60"}
      - {op: add, path: /data/ACCESS_READ_SECONDS, value: "180"}
      - {op: add, path: /data/ACCESS_WRITE_SECONDS, value: "120"}
      - {op: add, path: /data/MODEL_CATALOG_URL, value: "http://ollama:11434"}
      - {op: add, path: /data/PINNED_MODEL_DIGESTS, value: '{"qwen2.5:1.5b": "65ec06548149b04c096a120e4a6da9d4017ea809c91734ea5631e89f96ddc57b", "nomic-embed-text:latest": "0a109f422b47e3a30ba2b10eca18548e944e8a23073ee3f3e947efcf3c45e59f"}'}
  - target: {kind: Deployment, name: gateway}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/1/value, value: "http://ollama:11434/v1"}
      - {op: replace, path: /spec/template/spec/containers/0/env/2/value, value: "http://ollama:11434/v1"}
  - target: {kind: Deployment, name: ingest-cpu}
    patch: |-
      - {op: replace, path: /spec/template/spec/containers/0/env/2/value, value: "http://ollama:11434/v1"}
  - target: {kind: Deployment, name: ingest-gpu}
    patch: |-
      - {op: remove, path: /spec/template/spec/nodeSelector}
      - op: replace
        path: /spec/template/spec/tolerations
        value:
          - {key: antara.dev/workers-only, operator: Exists, effect: NoSchedule}
          - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
          - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, nodeTaintsPolicy: Honor, matchLabelKeys: [pod-template-hash], labelSelector: {matchLabels: {app: ingest-gpu}}}
