name: antara-k3s

services:
  k3s:
    image: rancher/k3s:v1.31.4-k3s1
    command: ["server", "--disable=metrics-server", "--write-kubeconfig-mode=644", "--tls-san=127.0.0.1"]
    hostname: antara-server
    privileged: true
    tmpfs:
      - /run
      - /var/run
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
    volumes:
      - k3s-data:/var/lib/rancher/k3s
      - ./.kube:/output
    ports:
      - "6443:6443"
      - "8000:80"

  worker:
    image: rancher/k3s:v1.31.4-k3s1
    command: ["agent", "--node-label=antara.dev/tier=workers", "--node-taint=antara.dev/workers-only=true:NoSchedule"]
    hostname: antara-worker
    privileged: true
    depends_on: [k3s]
    tmpfs:
      - /run
      - /var/run
    environment:
      K3S_URL: https://k3s:6443
      K3S_TOKEN: ${K3S_TOKEN:-}
    volumes:
      - worker-data:/var/lib/rancher/k3s
      - worker-node:/etc/rancher/node

volumes:
  k3s-data:
  worker-data:
  worker-node:
