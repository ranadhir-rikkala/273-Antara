global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["api:8000"]
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: workers
    static_configs:
      - targets:
          - ingest-cpu:9464
          - ingest-gpu:9464
          - agent:9464
          - tools:9464
          - reconciler:9464
