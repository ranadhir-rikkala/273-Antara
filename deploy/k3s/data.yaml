apiVersion: v1
kind: Secret
metadata:
  name: object-store-s3
  namespace: antara
type: Opaque
stringData:
  s3.json: |
    {"identities": [{"name": "antara",
      "credentials": [{"accessKey": "antara", "secretKey": "change-me-object-store"}],
      "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
---
apiVersion: v1
kind: Service
metadata:
  name: object-store
  namespace: antara
spec:
  selector: {app: object-store}
  ports: [{port: 8333}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: object-store
  namespace: antara
spec:
  serviceName: object-store
  replicas: 1
  selector: {matchLabels: {app: object-store}}
  template:
    metadata: {labels: {app: object-store}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.97@sha256:bb05d66d2963b1cc48073190781c3dd29e2c4c88a2ae2986bf58e38c86d89c6e
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
          ports: [{containerPort: 8333}]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - name: s3-config
          secret: {secretName: object-store-s3}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 20Gi}}
