apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-replication
  namespace: antara
data:
  pg_hba.conf: |
    local   all          all                trust
    host    all          all  127.0.0.1/32  trust
    host    all          all  ::1/128       trust
    local   replication  all                trust
    host    replication  all  all           scram-sha-256
    host    all          all  all           scram-sha-256
  standby.sh: |
    set -e
    if [ ! -s "$PGDATA/PG_VERSION" ]; then
      until pg_isready -h "$PRIMARY" -U "$PGUSER" -q; do sleep 2; done
      slots=$(psql -h "$PRIMARY" -U "$PGUSER" -d postgres -tAc "select count(*) from pg_replication_slots where slot_name = 'standby'")
      [ "$slots" = 1 ] || psql -h "$PRIMARY" -U "$PGUSER" -d postgres -qc "select pg_create_physical_replication_slot('standby')"
      pg_basebackup -h "$PRIMARY" -U "$PGUSER" -D "$PGDATA" -X stream -S standby
      touch "$PGDATA/standby.signal"
      printf "primary_conninfo = 'host=%s user=%s password=%s application_name=%s'\nprimary_slot_name = 'standby'\n" "$PRIMARY" "$PGUSER" "$PGPASSWORD" "$HOSTNAME" >> "$PGDATA/postgresql.auto.conf"
      chmod 700 "$PGDATA"
    fi
---
apiVersion: v1
kind: Service
metadata:
  name: app-db
  namespace: antara
spec:
  selector: {app: app-db}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app-db
  namespace: antara
spec:
  serviceName: app-db
  replicas: 1
  selector: {matchLabels: {app: app-db}}
  template:
    metadata: {labels: {app: app-db, antara/service: app-db, antara/role: primary}}
    spec:
      containers:
        - name: postgres
          args: ["postgres", "-c", "hba_file=/etc/postgresql/replication/pg_hba.conf"]
          image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
          env:
            - {name: POSTGRES_USER, value: antara}
            - {name: POSTGRES_DB, value: antara}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: antara-secrets, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "antara", "-d", "antara"]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: schema, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
            - {name: replication, mountPath: /etc/postgresql/replication, readOnly: true}
      volumes:
        - name: schema
          configMap: {name: app-db-schema}
        - name: replication
          configMap: {name: postgres-replication}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
---
