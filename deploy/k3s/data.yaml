apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app-db-standby
  namespace: antara
spec:
  serviceName: app-db-standby
  replicas: 1
  selector: {matchLabels: {app: app-db-standby}}
  template:
    metadata: {labels: {app: app-db-standby, antara/service: app-db, antara/role: standby}}
    spec:
      tolerations:
        - {key: antara.dev/workers-only, operator: Exists, effect: NoSchedule}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {antara/service: app-db}}
      initContainers:
        - name: clone-primary
          image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
          command: ["sh", "/etc/postgresql/replication/standby.sh"]
          securityContext: {runAsUser: 999, runAsGroup: 999}
          env:
            - {name: PRIMARY, value: app-db}
            - {name: PGUSER, value: antara}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: antara-secrets, key: POSTGRES_PASSWORD}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: replication, mountPath: /etc/postgresql/replication, readOnly: true}
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
          args: ["postgres", "-c", "hba_file=/etc/postgresql/replication/pg_hba.conf"]
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: antara-secrets, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "antara"]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: replication, mountPath: /etc/postgresql/replication, readOnly: true}
      volumes:
        - name: replication
          configMap: {name: postgres-replication}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
---
