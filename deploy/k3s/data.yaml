apiVersion: v1
kind: Service
metadata:
  name: app-db
  namespace: antara
spec:
  selector: {app: app-db}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: app-db
  namespace: antara
spec:
  serviceName: app-db
  replicas: 1
  selector: {matchLabels: {app: app-db}}
  template:
    metadata: {labels: {app: app-db}}
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16@sha256:0dd3149a06e4579a0d70d8fef9945636cd514005e7237deb27f9b67886f8dc4f
          env:
            - {name: POSTGRES_USER, value: antara}
            - {name: POSTGRES_DB, value: antara}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: antara-secrets, key: POSTGRES_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "antara", "-d", "antara"]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: schema, mountPath: /docker-entrypoint-initdb.d, readOnly: true}
      volumes:
        - name: schema
          configMap: {name: app-db-schema}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-db
  namespace: antara
spec:
  selector: {app: temporal-db}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: temporal-db
  namespace: antara
spec:
  serviceName: temporal-db
  replicas: 1
  selector: {matchLabels: {app: temporal-db}}
  template:
    metadata: {labels: {app: temporal-db}}
    spec:
      containers:
        - name: postgres
          image: postgres:16@sha256:933463a6c8eba2b9f5cd414138738cd8d5519cd2c471214c222652f547a66a32
          env:
            - {name: POSTGRES_USER, value: temporal}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: antara-secrets, key: TEMPORAL_DB_PASSWORD}}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "temporal"]}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 10Gi}}
---
apiVersion: v1
kind: Secret
metadata:
  name: object-store-s3
  namespace: antara
type: Opaque
stringData:
  s3.json: |
    {"identities": [{"name": "antara",
      "credentials": [{"accessKey": "antara", "secretKey": "change-me-object-store"}],
      "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
---
apiVersion: v1
kind: Service
metadata:
  name: object-store
  namespace: antara
spec:
  selector: {app: object-store}
  ports: [{port: 8333}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: object-store
  namespace: antara
spec:
  serviceName: object-store
  replicas: 1
  selector: {matchLabels: {app: object-store}}
  template:
    metadata: {labels: {app: object-store}}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.97@sha256:bb05d66d2963b1cc48073190781c3dd29e2c4c88a2ae2986bf58e38c86d89c6e
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
          ports: [{containerPort: 8333}]
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - name: s3-config
          secret: {secretName: object-store-s3}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 20Gi}}
