apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ingest-cpu
  namespace: antara
spec:
  scaleTargetRef: {name: ingest-cpu}
  minReplicaCount: 1
  maxReplicaCount: 4
  pollingInterval: 5
  cooldownPeriod: 60
  triggers:
    - type: temporal
      metadata:
        endpoint: temporal-frontend.antara.svc.cluster.local:7233
        namespace: default
        taskQueue: ingest-cpu
        queueTypes: activity
        targetQueueSize: "10"
---
