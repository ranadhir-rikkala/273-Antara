apiVersion: v1
kind: ConfigMap
metadata:
  name: antara-config
  namespace: antara
data:
  TEMPORAL_ADDRESS: temporal-frontend:7233
  S3_ENDPOINT: object-store:8333
  LLM_BASE_URL: http://gateway:8080/v1
  LLM_MODEL: qwen2.5-7b-instruct
  EMBEDDING_MODEL: nomic-embed-text-v1.5
  OTEL_ENDPOINT: http://jaeger:4317
  TEMPORAL_METRICS_PORT: "9464"
  AUTH_MODE: headers
---
apiVersion: v1
kind: Secret
metadata:
  name: antara-secrets
  namespace: antara
type: Opaque
stringData:
  DATABASE_URL: postgresql://antara:change-me-app-db@app-db:5432/antara
  POSTGRES_PASSWORD: change-me-app-db
  TEMPORAL_DB_PASSWORD: change-me-temporal-db
  S3_ACCESS_KEY: antara
  S3_SECRET_KEY: change-me-object-store
