apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: antara
spec:
  selector: {app: jaeger}
  ports:
    - {name: otlp, port: 4317}
    - {name: ui, port: 16686}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: antara
spec:
  replicas: 1
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
            - {name: QUERY_BASE_PATH, value: /jaeger}
          ports: [{containerPort: 4317}, {containerPort: 16686}]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: antara
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: antara
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: antara
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: antara}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: antara
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: antara
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.0@sha256:378f4e03703557d1c6419e6caccf922f96e6d88a530f7431d66a4c4f4b1000fe
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--web.external-url=/prometheus/", "--web.route-prefix=/"]
          ports: [{containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: antara
spec:
  selector: {app: grafana}
  ports: [{port: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: antara
spec:
  replicas: 1
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0@sha256:a0f881232a6fb71a0554a47d0fe2203b6888fe77f4cefb7ea62bed7eb54e13c3
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_SERVER_ROOT_URL, value: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboard-provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboards
          configMap: {name: grafana-dashboards}
