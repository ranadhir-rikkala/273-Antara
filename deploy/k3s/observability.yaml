apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: antara
spec:
  selector: {app: jaeger}
  ports:
    - {name: otlp, port: 4317}
    - {name: ui, port: 16686}
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-pods
  namespace: antara
spec:
  clusterIP: None
  selector: {app: jaeger}
  ports: [{name: otlp, port: 4317}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jaeger
  namespace: antara
spec:
  serviceName: jaeger-pods
  replicas: 2
  podManagementPolicy: Parallel
  selector: {matchLabels: {app: jaeger}}
  template:
    metadata: {labels: {app: jaeger}}
    spec:
      tolerations:
        - {key: antara.dev/workers-only, operator: Exists, effect: NoSchedule}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app: jaeger}}
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0@sha256:836e9b69c88afbedf7683ea7162e179de63b1f981662e83f5ebb68badadc710f
          env:
            - {name: COLLECTOR_OTLP_ENABLED, value: "true"}
            - {name: QUERY_BASE_PATH, value: /jaeger}
          ports: [{containerPort: 4317}, {containerPort: 16686}]
          readinessProbe:
            tcpSocket: {port: 16686}
            periodSeconds: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  namespace: antara
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
    processors:
      batch: {}
    exporters:
      otlp/jaeger-0:
        endpoint: jaeger-0.jaeger-pods:4317
        tls: {insecure: true}
      otlp/jaeger-1:
        endpoint: jaeger-1.jaeger-pods:4317
        tls: {insecure: true}
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp/jaeger-0, otlp/jaeger-1]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: antara
spec:
  selector: {app: otel-collector}
  ports: [{name: otlp, port: 4317}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: antara
spec:
  replicas: 2
  selector: {matchLabels: {app: otel-collector}}
  template:
    metadata: {labels: {app: otel-collector}}
    spec:
      tolerations:
        - {key: antara.dev/workers-only, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, nodeTaintsPolicy: Honor, matchLabelKeys: [pod-template-hash], labelSelector: {matchLabels: {app: otel-collector}}}
      containers:
        - name: collector
          image: otel/opentelemetry-collector:0.111.0@sha256:7020db3692a3d722fec002f39608ffe3a5d2fa4d09e14607cf33b9416f2c1df8
          args: ["--config=/etc/otelcol/config.yaml"]
          ports: [{containerPort: 4317}]
          volumeMounts:
            - {name: config, mountPath: /etc/otelcol, readOnly: true}
      volumes:
        - name: config
          configMap: {name: otel-collector}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: antara
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: antara
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: antara
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: prometheus}
subjects:
  - {kind: ServiceAccount, name: prometheus, namespace: antara}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: antara
spec:
  selector: {app: prometheus}
  ports: [{port: 9090}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: antara
spec:
  replicas: 2
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      tolerations:
        - {key: antara.dev/workers-only, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, nodeTaintsPolicy: Honor, matchLabelKeys: [pod-template-hash], labelSelector: {matchLabels: {app: prometheus}}}
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.0@sha256:378f4e03703557d1c6419e6caccf922f96e6d88a530f7431d66a4c4f4b1000fe
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--web.external-url=/prometheus/", "--web.route-prefix=/"]
          ports: [{containerPort: 9090}]
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus, readOnly: true}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: antara
spec:
  selector: {app: grafana}
  ports: [{port: 3000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: antara
spec:
  replicas: 2
  selector: {matchLabels: {app: grafana}}
  template:
    metadata: {labels: {app: grafana}}
    spec:
      tolerations:
        - {key: antara.dev/workers-only, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, nodeTaintsPolicy: Honor, matchLabelKeys: [pod-template-hash], labelSelector: {matchLabels: {app: grafana}}}
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0@sha256:a0f881232a6fb71a0554a47d0fe2203b6888fe77f4cefb7ea62bed7eb54e13c3
          env:
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
            - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
            - {name: GF_SERVER_ROOT_URL, value: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"}
            - {name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true"}
          ports: [{containerPort: 3000}]
          volumeMounts:
            - {name: datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: dashboard-provider, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
      volumes:
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: dashboard-provider
          configMap: {name: grafana-dashboard-provider}
        - name: dashboards
          configMap: {name: grafana-dashboards}
