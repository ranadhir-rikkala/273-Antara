apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: antara
spec:
  selector: {app: temporal}
  ports: [{port: 7233}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: antara
spec:
  replicas: 1
  selector: {matchLabels: {app: temporal}}
  template:
    metadata: {labels: {app: temporal}}
    spec:
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.25.2
          env:
            - {name: DB, value: postgres12}
            - {name: DB_PORT, value: "5432"}
            - {name: POSTGRES_SEEDS, value: temporal-db}
            - {name: POSTGRES_USER, value: temporal}
            - name: POSTGRES_PWD
              valueFrom: {secretKeyRef: {name: antara-secrets, key: TEMPORAL_DB_PASSWORD}}
          ports: [{containerPort: 7233}]
          readinessProbe:
            tcpSocket: {port: 7233}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: antara
spec:
  selector: {app: temporal-ui}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: antara
spec:
  replicas: 1
  selector: {matchLabels: {app: temporal-ui}}
  template:
    metadata: {labels: {app: temporal-ui}}
    spec:
      containers:
        - name: ui
          image: temporalio/ui:2.31.2
          env:
            - {name: TEMPORAL_ADDRESS, value: temporal-frontend:7233}
          ports: [{containerPort: 8080}]
