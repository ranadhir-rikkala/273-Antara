apiVersion: v1
kind: Service
metadata:
  name: temporal-frontend
  namespace: antara
spec:
  selector: {app: temporal}
  ports: [{port: 7233}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal
  namespace: antara
spec:
  replicas: 2
  selector: {matchLabels: {app: temporal}}
  template:
    metadata: {labels: {app: temporal}}
    spec:
      tolerations:
        - {key: antara.dev/workers-only, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, nodeTaintsPolicy: Honor, matchLabelKeys: [pod-template-hash], labelSelector: {matchLabels: {app: temporal}}}
      containers:
        - name: temporal
          image: temporalio/auto-setup:1.25.2@sha256:b1edc1e20002d958c8182f2ae08dee877a125083683a627a44917683419ba6a8
          env:
            - {name: DB, value: postgres12}
            - {name: DB_PORT, value: "5432"}
            - {name: POSTGRES_SEEDS, value: temporal-db}
            - {name: POSTGRES_USER, value: temporal}
            - name: POSTGRES_PWD
              valueFrom: {secretKeyRef: {name: antara-secrets, key: TEMPORAL_DB_PASSWORD}}
          ports: [{containerPort: 7233}]
          readinessProbe:
            tcpSocket: {port: 7233}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: temporal-ui
  namespace: antara
spec:
  selector: {app: temporal-ui}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
  namespace: antara
spec:
  replicas: 2
  selector: {matchLabels: {app: temporal-ui}}
  template:
    metadata: {labels: {app: temporal-ui}}
    spec:
      tolerations:
        - {key: antara.dev/workers-only, operator: Exists, effect: NoSchedule}
        - {key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
        - {key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 20}
      topologySpreadConstraints:
        - {maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: DoNotSchedule, nodeTaintsPolicy: Honor, matchLabelKeys: [pod-template-hash], labelSelector: {matchLabels: {app: temporal-ui}}}
      enableServiceLinks: false
      containers:
        - name: ui
          image: temporalio/ui:2.31.2@sha256:28bb3ea5a6ea3e09f16b521f32ab727c96470f7f1e420c66a6cbfb02001a8aa2
          env:
            - {name: TEMPORAL_ADDRESS, value: temporal-frontend:7233}
            - {name: TEMPORAL_UI_PUBLIC_PATH, value: /temporal}
            - {name: TEMPORAL_DISABLE_WRITE_ACTIONS, value: "true"}
          ports: [{containerPort: 8080}]
