apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: antara
spec:
  selector: {app: api}
  ports: [{port: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: antara
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata:
      labels: {app: api, antara/part: app}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8000"}
    spec:
      serviceAccountName: antara-api
      containers:
        - name: api
          image: antara-app:dev
          imagePullPolicy: Never
          command: ["uvicorn", "api.app:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef: {name: antara-config}
            - secretRef: {name: antara-secrets}
          env:
            - {name: SERVICE_NAME, value: "api"}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: antara
spec:
  selector: {app: gateway}
  ports: [{port: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: antara
spec:
  replicas: 1
  selector: {matchLabels: {app: gateway}}
  template:
    metadata:
      labels: {app: gateway, antara/part: app}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080"}
    spec:
      containers:
        - name: gateway
          image: antara-app:dev
          imagePullPolicy: Never
          command: ["uvicorn", "gateway.app:app", "--host", "0.0.0.0", "--port", "8080"]
          envFrom:
            - configMapRef: {name: antara-config}
            - secretRef: {name: antara-secrets}
          env:
            - {name: SERVICE_NAME, value: "gateway"}
            - {name: LLM_UPSTREAM_URL, value: "http://vllm:8000/v1"}
            - {name: EMBED_UPSTREAM_URL, value: "http://tei-gpu/v1"}
          ports: [{containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-cpu
  namespace: antara
spec:
  replicas: 1
  selector: {matchLabels: {app: ingest-cpu}}
  template:
    metadata:
      labels: {app: ingest-cpu, antara/part: app}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9464"}
    spec:
      containers:
        - name: ingest-cpu
          image: antara-app:dev
          imagePullPolicy: Never
          command: ["python", "-m", "ingest.worker"]
          envFrom:
            - configMapRef: {name: antara-config}
            - secretRef: {name: antara-secrets}
          env:
            - {name: SERVICE_NAME, value: "ingest-cpu"}
            - {name: WORKER_QUEUE, value: "ingest-cpu"}
            - {name: EMBEDDING_BASE_URL, value: "http://tei-cpu/v1"}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest-gpu
  namespace: antara
spec:
  replicas: 1
  selector: {matchLabels: {app: ingest-gpu}}
  template:
    metadata:
      labels: {app: ingest-gpu, antara/part: app}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9464"}
    spec:
      nodeSelector: {antara/gpu: "true"}
      tolerations:
        - {key: antara/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: ingest-gpu
          image: antara-app:dev
          imagePullPolicy: Never
          command: ["python", "-m", "ingest.worker"]
          envFrom:
            - configMapRef: {name: antara-config}
            - secretRef: {name: antara-secrets}
          env:
            - {name: SERVICE_NAME, value: "ingest-gpu"}
            - {name: WORKER_QUEUE, value: "ingest-gpu"}
---
