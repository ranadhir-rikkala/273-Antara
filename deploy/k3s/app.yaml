---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: antara
  namespace: antara
spec:
  rules:
    - http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service: {name: grafana, port: {number: 3000}}
          - path: /jaeger
            pathType: Prefix
            backend:
              service: {name: jaeger, port: {number: 16686}}
          - path: /temporal
            pathType: Prefix
            backend:
              service: {name: temporal-ui, port: {number: 8080}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: api, port: {number: 8000}}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prometheus
  namespace: antara
spec:
  stripPrefix:
    prefixes: [/prometheus]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: antara-prometheus
  namespace: antara
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: antara-strip-prometheus@kubernetescrd
spec:
  rules:
    - http:
        paths:
          - path: /prometheus
            pathType: Prefix
            backend:
              service: {name: prometheus, port: {number: 9090}}
