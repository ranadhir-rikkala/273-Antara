apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-time-slicing
  namespace: kube-system
data:
  config.yaml: |
    version: v1
    sharing:
      timeSlicing:
        resources:
          - name: nvidia.com/gpu
            replicas: 2
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  selector: {matchLabels: {name: nvidia-device-plugin}}
  template:
    metadata: {labels: {name: nvidia-device-plugin}}
    spec:
      runtimeClassName: nvidia
      nodeSelector: {antara/gpu: "true"}
      tolerations:
        - {key: antara/gpu, operator: Exists, effect: NoSchedule}
      priorityClassName: system-node-critical
      containers:
        - name: device-plugin
          image: nvcr.io/nvidia/k8s-device-plugin:v0.17.0
          args: ["--config-file=/config/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: device-plugin, mountPath: /var/lib/kubelet/device-plugins}
            - {name: config, mountPath: /config, readOnly: true}
      volumes:
        - name: device-plugin
          hostPath: {path: /var/lib/kubelet/device-plugins}
        - name: config
          configMap: {name: nvidia-time-slicing}
