apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - config.yaml
  - rbac.yaml
  - data.yaml
  - temporal.yaml
  - gpu.yaml
  - models.yaml
  - app.yaml
  - keda.yaml
  - network-policy.yaml
  - observability.yaml
  - ../signoz
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: app-db-schema
    namespace: antara
    files:
      - ../sql/001_schema.sql
      - ../sql/002_approvals.sql
      - ../sql/003_incidents.sql
      - ../sql/004_answer_cache.sql
      - ../sql/005_incident_systems.sql
      - ../sql/006_ops_events.sql
      - ../sql/007_access_leases.sql
