apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: antara
spec:
  selector: {app: vllm}
  ports: [{port: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: antara
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: vllm}}
  template:
    metadata: {labels: {app: vllm}}
    spec:
      runtimeClassName: nvidia
      nodeSelector: {antara/gpu: "true"}
      tolerations:
        - {key: antara/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: vllm
          image: vllm/vllm-openai:v0.6.4
          args:
            - --model=/models/Qwen2.5-7B-Instruct-AWQ
            - --served-model-name=qwen2.5-7b-instruct
            - --quantization=awq
            - --max-model-len=8192
            - --gpu-memory-utilization=0.75
            - --enable-auto-tool-choice
            - --tool-call-parser=hermes
          env:
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: VLLM_NO_USAGE_STATS, value: "1"}
          ports: [{containerPort: 8000}]
          resources:
            limits: {nvidia.com/gpu: 1}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 10
            failureThreshold: 60
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: models
          hostPath: {path: /opt/antara/models, type: Directory}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: tei-gpu
  namespace: antara
spec:
  selector: {app: tei-gpu}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tei-gpu
  namespace: antara
spec:
  replicas: 1
  selector: {matchLabels: {app: tei-gpu}}
  template:
    metadata: {labels: {app: tei-gpu}}
    spec:
      runtimeClassName: nvidia
      nodeSelector: {antara/gpu: "true"}
      tolerations:
        - {key: antara/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: tei
          image: ghcr.io/huggingface/text-embeddings-inference:turing-1.5
          args: ["--model-id=/models/nomic-embed-text-v1.5", "--served-model-name=nomic-embed-text-v1.5"]
          env:
            - {name: HF_HUB_OFFLINE, value: "1"}
          ports: [{containerPort: 80}]
          resources:
            limits: {nvidia.com/gpu: 1}
          readinessProbe:
            httpGet: {path: /health, port: 80}
            periodSeconds: 10
          volumeMounts:
            - {name: models, mountPath: /models, readOnly: true}
      volumes:
        - name: models
          hostPath: {path: /opt/antara/models, type: Directory}
---
