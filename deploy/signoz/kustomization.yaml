apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: antara
resources:
  - crds.yaml
  - signoz.yaml
  - network-policy.yaml
patches:
  - target: {kind: "Deployment|StatefulSet|Job", name: "signoz.*"}
    patch: |-
      - {op: add, path: /spec/template/metadata/labels/antara~1service, value: signoz}
  - target: {kind: ClickHouseInstallation, name: signoz-clickhouse}
    patch: |-
      - {op: add, path: /spec/templates/podTemplates/0/metadata/labels/antara~1service, value: signoz}
