global:
  storageClass: local-path
  clusterName: antara-local

clickhouse:
  initContainers:
    enabled: true
    udf:
      enabled: true
      image:
        registry: docker.io
        repository: library/antara-signoz-udf
        tag: v0.0.1
        pullPolicy: Never
      command:
        - sh
        - -c
        - cp /histogram-quantile /var/lib/clickhouse/user_scripts/histogramQuantile
  layout:
    shardsCount: 1
    replicasCount: 1
  persistence:
    size: 10Gi
  resources:
    requests: {cpu: 100m, memory: 1Gi}
    limits: {memory: 4Gi}
  zookeeper:
    resources:
      requests: {cpu: 50m, memory: 256Mi}
      limits: {memory: 512Mi}
  clickhouseOperator:
    resources:
      requests: {cpu: 20m, memory: 64Mi}

signoz:
  persistence:
    size: 1Gi
  resources:
    requests: {cpu: 100m, memory: 200Mi}
    limits: {memory: 1Gi}
  env:
    signoz_telemetrystore_provider: clickhouse
    signoz_emailing_enabled: false
    signoz_prometheus_active__query__tracker_enabled: false
    signoz_alertmanager_provider: signoz
    signoz_alertmanager_signoz_external__url: http://localhost:8000/signoz
    signoz_global_external__url: http://localhost:8000/signoz
    signoz_analytics_enabled: false
    signoz_statsreporter_enabled: false
    signoz_user_root_enabled: true
    signoz_user_root_email: admin@antara.local
    signoz_user_root_password: Antara-Observe-2026!
    signoz_user_root_org_name: antara
    signoz_identn_impersonation_enabled: true
    signoz_identn_tokenizer_enabled: false
    signoz_identn_apikey_enabled: false

telemetryStoreMigrator:
  enabled: true

otelCollector:
  replicaCount: 1
  resources:
    requests: {cpu: 100m, memory: 200Mi}
    limits: {memory: 1Gi}
  config:
    receivers:
      prometheus:
        config:
          scrape_configs:
            - job_name: antara-pods
              scrape_interval: 15s
              kubernetes_sd_configs:
                - role: pod
                  namespaces: {names: [antara]}
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  regex: "true"
                  action: keep
                - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
                  regex: (.+);(.+)
                  replacement: $$1:$$2
                  target_label: __address__
                - source_labels: [__meta_kubernetes_pod_label_app]
                  target_label: app
                - source_labels: [__meta_kubernetes_pod_name]
                  target_label: instance
    service:
      pipelines:
        metrics:
          receivers: [otlp, prometheus]
