apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-signoz-to-kubernetes-api
  namespace: antara
spec:
  podSelector:
    matchExpressions: [{key: app.kubernetes.io/component, operator: In, values: [otel-collector, operator]}]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
      ports:
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
